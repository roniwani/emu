<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>emuお誕生日おめでとう</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background-color: #0a0a0a;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* メッセージテキスト */
        .message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            animation: fadeInOut 6s ease-in-out forwards;
        }

        .message-main {
            font-size: 4rem;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 
                0 0 10px #00ff00,
                0 0 20px #00ff00,
                0 0 30px #00ff00,
                0 0 40px #00ff00;
            white-space: nowrap;
            margin-bottom: 20px;
        }

        .message-sub {
            font-size: 1.5rem;
            color: #00ff00;
            text-shadow: 
                0 0 10px #00ff00,
                0 0 20px #00ff00;
            white-space: nowrap;
        }

        @keyframes fadeInOut {
            0% {
                opacity: 1;
                text-shadow: 
                    0 0 10px #00ff00,
                    0 0 20px #00ff00,
                    0 0 30px #00ff00,
                    0 0 40px #00ff00,
                    0 0 50px #00ff00;
            }
            70% {
                opacity: 1;
                text-shadow: 
                    0 0 10px #00ff00,
                    0 0 20px #00ff00,
                    0 0 30px #00ff00,
                    0 0 40px #00ff00,
                    0 0 50px #00ff00;
            }
            100% {
                opacity: 0;
                text-shadow: 
                    0 0 10px #00ff00,
                    0 0 20px #00ff00,
                    0 0 30px #00ff00,
                    0 0 40px #00ff00,
                    0 0 50px #00ff00;
            }
        }

        /* スライドインテキスト */
        .slide-text {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.8rem;
            color: #00ff00;
            text-shadow: 
                0 0 10px #00ff00,
                0 0 20px #00ff00;
            text-align: center;
            max-width: 80%;
            z-index: 10;
            opacity: 0;
            line-height: 1.8;
            animation: slideIn 5s ease-in-out forwards;
        }

        .slide-text.slide1 { animation-delay: 6s; }
        .slide-text.slide2 { animation-delay: 11s; }
        .slide-text.slide3 { animation-delay: 16s; }
        .slide-text.slide4 { animation-delay: 21s; }
        .slide-text.slide5 { animation-delay: 26s; }
        .slide-text.slide6 { animation-delay: 31s; }

        @keyframes slideIn {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(50px);
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-50px);
            }
        }

        /* 雪のコンテナ */
        .snowflakes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            color: #ffffff;
            font-size: 1.5em;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) translateX(var(--tx));
                opacity: 0;
            }
        }

        /* ネオン背景グロー */
        .background-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(0, 255, 0, 0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="background-glow"></div>
        <div class="message">
            <div class="message-main">emuお誕生日おめでとう</div>
            <div class="message-sub">⚠︎まだ続きがあります少々お待ちください。</div>
        </div>
        
        <div class="slide-text slide1">emuお誕生日おめでとう！いつも優しくていつもかまってくれてありがと。</div>
        <div class="slide-text slide2">早く会いたいよ<br>会ったら色んなことしよ！</div>
        <div class="slide-text slide3">元カノ6人ぐらい居てちょっと怖かったよ笑<br>一番驚いたのは外国人とも付き合ってたこと笑</div>
        <div class="slide-text slide4">それにemu1pしてたとか<br>顔がゆで卵とか笑</div>
        <div class="slide-text slide5">可愛いくてかっこいい<br>そんなemuがだいすき！</div>
        <div class="slide-text slide6">何回か喧嘩したよね<br>ほんとは俺別れるか不安だったよ笑<br>これからもずっとそばにいてね！<br>だいすき！</div>

        <div class="snowflakes" id="snowflakes"></div>
    </div>

    <script>
        // 雪のエフェクトを生成
        function createSnowflakes() {
            const snowflakesContainer = document.getElementById('snowflakes');
            const snowflakeCount = 50;

            for (let i = 0; i < snowflakeCount; i++) {
                const snowflake = document.createElement('div');
                snowflake.classList.add('snowflake');
                snowflake.textContent = '❄';

                // ランダムな位置
                const xPos = Math.random() * window.innerWidth;
                const duration = 5 + Math.random() * 8; // 5-13秒
                const delay = Math.random() * 4; // 0-4秒のディレイ
                const tx = (Math.random() - 0.5) * 200; // 横方向の揺らぎ

                snowflake.style.left = xPos + 'px';
                snowflake.style.setProperty('--tx', tx + 'px');
                snowflake.style.animationDuration = duration + 's';
                snowflake.style.animationDelay = delay + 's';
                snowflake.style.fontSize = (0.5 + Math.random() * 1) + 'em';
                snowflake.style.opacity = 0.3 + Math.random() * 0.7;

                snowflakesContainer.appendChild(snowflake);
            }
        }

        // ページ読み込み後に雪を生成
        window.addEventListener('load', () => {
            createSnowflakes();
            
            // 雪が途切れないよう継続的に追加
            setInterval(() => {
                const snowflakesContainer = document.getElementById('snowflakes');
                const snowflake = document.createElement('div');
                snowflake.classList.add('snowflake');
                snowflake.textContent = '❄';

                const xPos = Math.random() * window.innerWidth;
                const duration = 5 + Math.random() * 8;
                const tx = (Math.random() - 0.5) * 200;

                snowflake.style.left = xPos + 'px';
                snowflake.style.setProperty('--tx', tx + 'px');
                snowflake.style.animationDuration = duration + 's';
                snowflake.style.fontSize = (0.5 + Math.random() * 1) + 'em';
                snowflake.style.opacity = 0.3 + Math.random() * 0.7;

                snowflakesContainer.appendChild(snowflake);

                // 古い雪を削除
                if (snowflakesContainer.children.length > 100) {
                    snowflakesContainer.removeChild(snowflakesContainer.firstChild);
                }
            }, 500);
        });
    </script>
</body>
</html>
